<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>CRM - Samochody</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-gray-900 min-h-screen p-6">
  <nav class="bg-gray-800 shadow mb-6 p-4 flex justify-between items-center rounded-xl">
    <div class="text-xl font-semibold text-white">CRM System</div>
    <div class="space-x-2">
      <a href="dashboard.html" class="px-4 py-2 rounded-xl text-white hover:bg-gray-700 transition">Dashboard</a>
      <a href="clients.html" class="px-4 py-2 rounded-xl text-white hover:bg-gray-700 transition">Klienci</a>
      <a href="finance.html" class="px-4 py-2 rounded-xl text-white hover:bg-gray-700 transition">Finanse</a>
      <a href="vehicles.html" class="px-4 py-2 rounded-xl bg-blue-800 text-white hover:bg-blue-300 transition">Samochody</a>
    </div>
  </nav>
  

  <h1 class="text-3xl font-bold mb-4">Samochody</h1>

  <div class="mb-4 flex gap-4 flex-wrap">
    <input type="text" id="search" placeholder="Wyszukaj markę, model lub rejestrację" class="p-3 border rounded-xl flex-grow min-w-[200px]">
    <button id="exportCsv" class="px-4 py-2 bg-green-600 text-white rounded-xl hover:bg-green-700">
      Eksportuj do CSV
    </button>
    <a href="add-vehicle.html" class="px-4 py-2 bg-blue-600 text-white rounded-xl hover:bg-blue-700 flex items-center justify-center">
      Dodaj auto
    </a>
  </div>

  <div id="result-count" class="mb-4 text-gray-700">Liczba wyników: 0</div>

  <div class="overflow-x-auto shadow-lg rounded-xl">
    <table class="min-w-full text-left text-sm text-gray-800">
      <thead class="uppercase">
        <tr>
          <th class="px-6 py-3">ID</th>
          <th class="px-6 py-3">Marka</th>
          <th class="px-6 py-3">Model</th>
          <th class="px-6 py-3">Przypisany klient</th>
          <th class="px-6 py-3">Numer rejestracyjny</th>
          <th class="px-6 py-3 sortable" data-sort="insurance">Ubezpieczenie ⬍</th>
          <th class="px-6 py-3">VIN</th>
          <th class="px-6 py-3 sortable" data-sort="production">Data produkcji ⬍</th>
          <th class="px-6 py-3">Historia serwisowa</th>
        </tr>
      </thead>
      <tbody id="vehicles-table-body"></tbody>
    </table>
  </div>

  <div class="mt-4 flex justify-between items-center">
    <button id="prevPage" class="px-4 py-2 bg-blue-600 text-white rounded-xl hover:bg-blue-700">Poprzednia</button>
    <span id="pageInfo" class="text-gray-700"></span>
    <button id="nextPage" class="px-4 py-2 bg-blue-600 text-white rounded-xl hover:bg-blue-700">Następna</button>
  </div>

  <!-- FE08.3: historia serwisowa pojazdu + dodawanie wpisów -->
  <div id="serviceModal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl p-6 w-full max-w-lg shadow-lg">
      <h2 class="text-xl font-bold mb-4" id="serviceModalTitle">Historia serwisowa</h2>
      <ul id="serviceHistoryList" class="space-y-1 text-sm mb-4 max-h-48 overflow-y-auto list-disc list-inside"></ul>
      <div class="flex flex-wrap gap-2 items-end border-t pt-4">
        <div>
          <label class="block text-xs text-gray-600">Data</label>
          <input type="date" id="serviceEntryDate" class="border rounded-lg px-2 py-1">
        </div>
        <div class="flex-grow min-w-[150px]">
          <label class="block text-xs text-gray-600">Opis wykonanej czynności</label>
          <input type="text" id="serviceEntryDesc" placeholder="np. Wymiana oleju" class="border rounded-lg px-2 py-1 w-full">
        </div>
        <button id="addServiceEntryBtn" class="px-4 py-2 bg-green-600 text-white rounded-xl hover:bg-green-700">Dodaj wpis</button>
      </div>
      <div class="mt-6 flex justify-end">
        <button id="closeServiceModal" class="px-4 py-2 bg-gray-600 text-white rounded-xl hover:bg-gray-700">Zamknij</button>
      </div>
    </div>
  </div>

  <script src="js/vehicles.js"></script>
</body>
</html>
