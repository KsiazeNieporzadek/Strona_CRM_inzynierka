<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>CRM - Logowanie</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center">
  <div class="bg-tile shadow-xl rounded-xl p-10 w-full max-w-md">

    <h1 class="text-3xl font-bold mb-6 text-center text-gray-200">Logowanie do CRM</h1>
<form id="loginForm" class="space-y-6">
  <div>
    <label class="block mb-2 text-gray-300">E-mail</label>
    <input type="email" id="email" placeholder="Wprowadź e-mail" class="w-full p-4 text-lg rounded-xl">
  </div>
  <div>
    <label class="block mb-2 text-gray-300">Hasło</label>
    <input type="password" id="password" placeholder="Wprowadź hasło" class="w-full p-4 text-lg rounded-xl">
  </div>
  <div class="flex justify-center">
    <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded-xl hover:bg-green-700 transition">
      Zaloguj się
    </button>
  </div>
</form>

    <p class="text-center text-gray-400 text-sm mt-6">© 2025 CRM System. Wszelkie prawa zastrzeżone.</p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      // Tu możesz dodać walidację email/hasło, np. jeśli chcesz w przyszłości
      window.location.href = 'clients.html';
    });
  </script>
</body>
</html>
