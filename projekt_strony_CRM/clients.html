<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>CRM - Klienci</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-gray-900 text-gray-200 min-h-screen p-6">
  
  <nav class="bg-gray-800 shadow mb-6 p-4 flex justify-between items-center rounded-xl">
    <div class="text-xl font-semibold text-white">CRM System</div>
    <div class="space-x-2">
      <a href="dashboard.html" class="px-4 py-2 rounded-xl text-white hover:bg-gray-700 transition">Dashboard</a>
      <a href="clients.html" class="px-4 py-2 rounded-xl bg-blue-800 text-white hover:bg-blue-700 transition">Klienci</a>
      <a href="finance.html" class="px-4 py-2 rounded-xl text-white hover:bg-gray-700 transition">Finanse</a>
      <a href="vehicles.html" class="px-4 py-2 rounded-xl text-white hover:bg-gray-700 transition">Samochody</a>
    </div>
  </nav>
  
  <h1 class="text-3xl font-bold mb-6 text-white">Klienci</h1>

  <div class="mb-6 flex flex-wrap items-center gap-4">
    <input 
      type="text" 
      id="search" 
      placeholder="Wyszukaj imię, nazwisko lub NIP" 
      class="bg-gray-800 text-white border border-gray-700 rounded-xl px-4 py-2 flex-grow min-w-[200px] focus:outline-none focus:ring-2 focus:ring-blue-500"
    >
    
    <select 
      id="statusFilter" 
      class="bg-gray-800 text-white border border-gray-700 rounded-xl px-4 py-2 w-48 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer"
    >
      <option value="all">Wszystkie statusy</option>
      <option value="aktywny">Aktywny</option>
      <option value="lejek">Lejek sprzedażowy</option>
      <option value="windykacja">Windykacja</option>
    </select>
    
    <button id="exportCsv" class="px-4 py-2 bg-green-600 text-white rounded-xl hover:bg-green-700 transition">
      Eksportuj do CSV
    </button>
    
    <a href="add-client.html" class="px-4 py-2 bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition flex items-center justify-center">
      Dodaj klienta
    </a>
  </div>

  <div id="result-count" class="mb-4 text-gray-400 font-medium">Liczba wyników: 0</div>

  <div class="overflow-x-auto shadow-lg rounded-xl bg-gray-800">
    <table class="min-w-full text-left text-sm text-gray-300">
      <thead class="uppercase bg-gray-700 text-gray-200">
        <tr>
          <th class="px-6 py-4 cursor-pointer hover:text-white transition" data-sort="id">ID ↕</th>
          <th class="px-6 py-4 cursor-pointer hover:text-white transition" data-sort="firstName">Imię ↕</th>
          <th class="px-6 py-4 cursor-pointer hover:text-white transition" data-sort="lastName">Nazwisko ↕</th>
          <th class="px-6 py-4 cursor-pointer hover:text-white transition" data-sort="status">Status ↕</th>
          <th class="px-6 py-4">PESEL</th>
          <th class="px-6 py-4">NIP</th>
          <th class="px-6 py-4">Email</th>
          <th class="px-6 py-4">Telefon</th>
          <th class="px-6 py-4">Adres</th>
          <th class="px-6 py-4">Profil</th>
        </tr>
      </thead>
      <tbody id="clients-table-body" class="divide-y divide-gray-700">
        </tbody>
    </table>
  </div>

  <div class="mt-6 flex justify-between items-center">
    <button id="prevPage" class="px-4 py-2 bg-blue-600 text-white rounded-xl hover:bg-blue-700 disabled:opacity-50 transition">
      Poprzednia
    </button>
    <span id="pageInfo" class="text-gray-400 font-medium">Strona 1 z 1</span>
    <button id="nextPage" class="px-4 py-2 bg-blue-600 text-white rounded-xl hover:bg-blue-700 disabled:opacity-50 transition">
      Następna
    </button>
  </div>

  <!-- FE01.3 / FEP05: profil klienta (dane identyfikacyjne, adresowe, kontaktowe) + archiwizacja z potwierdzeniem -->
  <div id="clientModal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-4">
    <div class="bg-gray-800 rounded-xl p-6 w-full max-w-md text-gray-200 shadow-lg">
      <h2 class="text-xl font-bold mb-4">Profil klienta</h2>
      <div id="clientModalBody" class="space-y-1 text-sm"></div>
      <div class="mt-6 flex justify-end gap-2">
        <button id="archiveClientBtn" class="px-4 py-2 bg-red-600 text-white rounded-xl hover:bg-red-700 transition">Archiwizuj</button>
        <button id="closeClientModal" class="px-4 py-2 bg-gray-600 text-white rounded-xl hover:bg-gray-700 transition">Zamknij</button>
      </div>
    </div>
  </div>

  <script src="js/clients.js"></script>
</body>
</html>
